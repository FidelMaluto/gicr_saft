<div class="container-fluid py-4">
  <h2 class="mb-4">Gestão de Clientes</h2>

  <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="successMessage = ''"></button>
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ errorMessage }}
    <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
  </div>

  <div class="row g-4">
    <!-- Formulário de novo cliente -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Novo Cliente</div>
        <div class="card-body">
          <form (ngSubmit)="addCustomer()">
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.name" name="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">NIF</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.nif" name="nif" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="newCustomer.email" name="email">
            </div>
            <div class="mb-3">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.phone" name="phone">
            </div>
            <div class="mb-3">
              <label class="form-label">Endereço</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.address" name="address">
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar Cliente</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabela de clientes -->
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Nome</th>
                <th>NIF</th>
                <th>Email</th>
                <th>Telefone</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let customer of customers">
                <td>{{ customer.name }}</td>
                <td>{{ customer.nif }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phone }}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteCustomer(customer.id)">
                    Eliminar
                  </button>
                </td>
              </tr>
              <tr *ngIf="customers.length === 0">
                <td colspan="5" class="text-center text-muted py-4">Nenhum cliente registado.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
