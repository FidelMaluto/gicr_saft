<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
    <div class="card-body p-4">
      <h3 class="text-center mb-4">Iniciar Sessão</h3>

      <div *ngIf="errorMessage" class="alert alert-danger py-2">{{ errorMessage }}</div>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="senhaCifrada" name="senhaCifrada" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
